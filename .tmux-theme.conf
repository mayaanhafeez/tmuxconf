set -g status-style "bg=black,fg=white"
set -g status-left ""
set -g status-right ""
set -g window-status-format "#I:#W#F"
set -g window-status-current-format "#I:#W#F"
set -g window-status-style "fg=brightblack"
set -g window-status-current-style "fg=blue"
set -g window-status-separator " "
setw -g pane-status-current-style "default"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "bg=default,fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
